- title: Combinatorial Auctions
  authors: Joshua Peter Ebenezer
  venue: Final project report, Combinatorial Optimization, UT Austin
  year: 2020
  section: other
  image: /assets/img/publications/combinatorial-auctions.jpg
  pdf: /assets/pdf/Combinatorial_Auctions.pdf
  links: []
  abstract: >-
    A combinatorial auction is a type of auction in which bidders can assign values to combinations of
    items, instead of only assigning values to individual items. These are useful in situations where
    bidders place more or less value to a combination of items than to the sum of the individual values
    of those items. In this project report, some of the main results in combinatorial auctions are studied
    in an expository fashion, with particular attention given to a subclass of combinatorial auctions
    called the submodular welfare problem.
