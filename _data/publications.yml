  abstract: >-
    Video content continues to proliferate, already accounting for more than 70% of internet traffic,
    and projected to exceed 82% of internet traffic by 2021. Distortions can affect videos as they are
    captured, transmitted, and received. It is of vital importance to providers of video content to be
    able to monitor and predict the perceptual quality of their videos, since this directly impacts customer
    satisfaction. Video quality tools can also help make well-informed design choices while creating systems
    for capturing, processing, transmitting, and displaying videos. Video quality assessment algorithms
    also have applications in video denoising, designing loss functions for deep learning, video compression,
    and many other high-impact areas.
