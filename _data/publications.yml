- title: "MFSR-GAN: Multi-Frame Super-Resolution with Handheld Motion Modeling"
  authors: Fadeel Sher Khan, Joshua Ebenezer, Hamid Sheikh, Seok-Jun Lee
  venue: CVPR Workshops (CVPRW)
  year: 2025
  section: research
  image: /assets/img/publications/mfsr-gan.jpg
  pdf: https://arxiv.org/pdf/2502.20824
  links:
    - name: publisher
      url: https://ieeexplore.ieee.org/abstract/document/11147534/
    - name: arXiv
      url: https://arxiv.org/abs/2502.20824
  abstract: >-
    Smartphone cameras have become ubiquitous imaging tools, yet their small sensors and compact optics
    often limit spatial resolution and introduce distortions. Combining information from multiple low-resolution
    (LR) frames to produce a high-resolution (HR) image has been explored to overcome the inherent limitations
    of smartphone cameras. Despite the promise of multi-frame super-resolution (MFSR), current approaches
    are hindered by datasets that fail to capture the characteristic noise and motion patterns found in
    real-world handheld burst images. In this work, we address this gap by introducing a novel synthetic
    data engine that uses multi-exposure static images to synthesize LR-HR training pairs while preserving
    sensor-specific noise characteristics and image motion found during handheld burst photography. We
    also propose MFSR-GAN: a multi-scale RAW-to-RGB network for MFSR. Compared to prior approaches, MFSR-GAN
    emphasizes a "base frame" throughout its architecture to mitigate artifacts. Experimental results
    on both synthetic and real data demonstrates that MFSR-GAN trained with our synthetic engine yields
    sharper, more realistic reconstructions than existing methods for real-world MFSR.
  scholar_id: kNdYIx-mwKoC
- title: "HDR-ChipQA: No-Reference Quality Assessment on High Dynamic Range Videos"
  authors: Joshua P Ebenezer*, Zaixi Shang*, Yongjun Wu, Hai Wei, Sriram Sethuraman, Alan C Bovik
  equal_contribution: true
  venue: "Signal Processing: Image Communication"
  year: 2024
  section: research
  image: /assets/img/publications/hdr-chipqa.jpg
  pdf: https://www.sciencedirect.com/science/article/am/pii/S0923596524000924
  links:
    - name: publisher
      url: https://www.sciencedirect.com/science/article/pii/S0923596524000924
  abstract: >-
    We present a no-reference video quality model and algorithm that delivers standout performance for
    High Dynamic Range (HDR) videos, which we call HDR-ChipQA. HDR videos represent wider ranges of luminances,
    details, and colors than Standard Dynamic Range (SDR) videos. The growing adoption of HDR in massively
    scaled video networks has driven the need for video quality assessment (VQA) algorithms that better
    account for distortions on HDR content. In particular, standard VQA models may fail to capture conspicuous
    distortions at the extreme ends of the dynamic range, because the features that drive them may be
    dominated by distortions that pervade the mid-ranges of the signal. We introduce a new approach whereby
    a local expansive nonlinearity emphasizes distortions occurring at the higher and lower ends of the
    local luma range, allowing for the deﬁnition of additional quality-aware features that are computed
    along a separate path. These features are not HDR-speciﬁc, and also improve VQA on SDR video contents,
    albeit to a reduced degree. We show that this preprocessing step signiﬁcantly boosts the power of
    distortion-sensitive natural video statistics (NVS) features when used to predict the quality of HDR
    content. In similar manner, we separately compute novel wide-gamut color features using the same nonlinear
    processing steps. We have found that our model signiﬁcantly outperforms SDR VQA algorithms on the
    only publicly available, comprehensive HDR database, while also attaining state-of-the-art performance
    on SDR content.
  scholar_id: 0EnyYjriUFMC
- title: "Quality Assessment in Media and Entertainment: Challenges and Trends"
  authors: Abhinau K Venkataramanan, Zaixi Shang, Joshua P Ebenezer, Meixu Chen, Zhengzhong Tu, Alan C
    Bovik
  venue: "Computer Vision: Challenges, Trends, and Opportunities (book chapter)"
  year: 2024
  section: research
  image: /assets/img/publications/qa-media-chapter.jpg
  pdf: /assets/pdf/papers/quality-assessment-media-entertainment.pdf
  links: []
  abstract: >-
    Assessing and optimizing the perceptual quality of media plays an important role in enhancing the
    subjective experiences of hundreds of millions of television, streaming, and social media viewers.
    Quality assessment methods may be broadly categorized into “subjective” and “objective” methods. Subjective
    quality assessment consists of conducting studies where participants manually rate the quality of
    media. On the other hand, objective quality models consist of algorithms designed to accurately predict
    subjective quality. In this chapter, we will discuss the challenges in assessing the quality of popular
    visual media, including streaming video, virtual reality, high-dynamic-range, high-framerate, and
    user-generated video. In particular, we will discuss subjective databases and state-of-the-art quality
    models that have been developed to address the problem of quality assessment. Finally, we will discuss
    future trends and open problems that are interesting to tackle.
  scholar_id: 3fE2CSJIrl8C
- title: HDR or SDR? A Subjective and Objective Study of Scaled and Compressed Videos
  authors: Joshua P Ebenezer*, Zaixi Shang*, Yixu Chen, Yongjun Wu, Hai Wei, Sriram Sethuraman, Alan C Bovik
  equal_contribution: true
  venue: IEEE Transactions on Image Processing
  year: 2024
  section: research
  image: /assets/img/publications/hdr-or-sdr.jpg
  pdf: https://arxiv.org/pdf/2304.13162
  links:
    - name: publisher
      url: https://ieeexplore.ieee.org/abstract/document/10542644/
    - name: arXiv
      url: https://arxiv.org/abs/2304.13162
  abstract: >-
    We conducted a large-scale study of human perceptual quality judgments of High Dynamic Range (HDR)
    and Standard Dynamic Range (SDR) videos subjected to scaling and compression levels and viewed on
    three different display devices. HDR videos are able to present wider color gamuts, better contrasts,
    and brighter whites and darker blacks than SDR videos. While conventional expectations are that HDR
    quality is better than SDR quality, we have found subject preference of HDR versus SDR depends heavily
    on the display device, as well as on resolution scaling and bitrate. To study this question, we collected
    more than 23,000 quality ratings from 67 volunteers who watched 356 videos on OLED, QLED, and LCD
    televisions. Since it is of interest to be able to measure the quality of videos under these scenarios,
    e.g. to inform decisions regarding scaling, compression, and SDR vs HDR, we tested several well-known
    full-reference and no-reference video quality models on the new database. Towards advancing progress
    on this problem, we also developed a novel no-reference model called HDRPatchMAX, that uses both classical
    and bit-depth sensitive distortion statistics more accurately than existing metrics.
  scholar_id: hqOjcs7Dif8C
- title: A Study of Subjective and Objective Quality Assessment of HDR Videos
  authors: >-
    Zaixi Shang*, Joshua P Ebenezer*, Abhinau K Venkataramanan, Yongjun Wu, Hai Wei, Sriram Sethuraman,
    Alan C Bovik
  equal_contribution: true
  venue: IEEE Transactions on Image Processing
  year: 2023
  section: research
  image: /assets/img/publications/live-hdr.jpg
  pdf: https://par.nsf.gov/servlets/purl/10503357
  links:
    - name: publisher
      url: https://ieeexplore.ieee.org/abstract/document/10325414/
  abstract: >-
    As compared to standard dynamic range (SDR) videos, high dynamic range (HDR) content is able to represent
    and display much wider and more accurate ranges of brightness and color, leading to more engaging
    and enjoyable visual experiences. HDR also implies increases in data volume, further challenging existing
    limits on bandwidth consumption and on the quality of delivered content. Perceptual quality models
    are used to monitor and control the compression of streamed SDR content. A similar strategy should
    be useful for HDR content, yet there has been limited work on building HDR video quality assessment
    (VQA) algorithms. One reason for this is a scarcity of highquality HDR VQA databases representative
    of contemporary HDR standards. Towards filling this gap, we created the first publicly available HDR
    VQA database dedicated to HDR10 videos, called the Laboratory for Image and Video Engineering (LIVE)
    HDR Database. It comprises 310 videos from 31 distinct source sequences processed by ten different
    compression and resolution combinations, simulating bitrate ladders used by the streaming industry.
    We used this data to conduct a subjective quality study, gathering more than 20,000 human quality
    judgments under two different illumination conditions. To demonstrate the usefulness of this new psychometric
    data resource, we also designed a new full-reference (FR) HDR VQA algorithm called HDR-VMAF, extending
    the widely-deployed Video Multimethod Assessment Fusion (VMAF) model using a nonlinear transform to
    highlight distortions on HDR-enhanced areas. We show that HDR-VMAF provides significantly elevated
    performance on both HDR and SDR videos, exceeding prior state-of-the-art model performance.
  scholar_id: MXK_kJrjxJIC
- title: Making Video Quality Assessment Models Robust to Bit Depth
  authors: Joshua P Ebenezer, Zaixi Shang, Yongjun Wu, Hai Wei, Sriram Sethuraman, Alan C Bovik
  venue: IEEE Signal Processing Letters
  year: 2023
  section: research
  image: /assets/img/publications/bit-depth.jpg
  pdf: https://arxiv.org/pdf/2304.13092
  links:
    - name: publisher
      url: https://ieeexplore.ieee.org/abstract/document/10105991/
    - name: arXiv
      url: https://arxiv.org/abs/2304.13092
  abstract: >-
    We introduce a novel feature set, which we call HDRMAX features, that when included into Video Quality
    Assessment (VQA) algorithms designed for Standard Dynamic Range (SDR) videos, sensitizes them to distortions
    of High Dynamic Range (HDR) videos that are inadequately accounted for by these algorithms. While
    these features are not specific to HDR, and also augment the equality prediction performances of VQA
    models on SDR content, they are especially effective on HDR. HDRMAX features modify powerful priors
    drawn from Natural Video Statistics (NVS) models by enhancing their measurability where they visually
    impact the brightest and darkest local portions of videos, thereby capturing distortions that are
    often poorly accounted for by existing VQA models. As a demonstration of the efficacy of our approach,
    we show that, while current state-of-the-art VQA models perform poorly on 10-bit HDR databases, their
    performances are greatly improved by the inclusion of HDRMAX features when tested on HDR and 10-bit
    distorted videos.
  scholar_id: UebtZRa9Y70C
