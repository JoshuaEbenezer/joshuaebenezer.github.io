- title: A Screening CAD Tool for the Detection of Microcalcification Clusters in Mammograms
  authors: >-
    Vikrant A Karale, Joshua P Ebenezer, Jayasree Chakraborty, Tulika Singh, Anup Sadhu, Niranjan Khandelwal,
    Sudipta Mukhopadhyay
  venue: Journal of Digital Imaging
  year: 2019
  section: research
  image: /assets/img/publications/cad-mammograms.jpg
  pdf: https://pmc.ncbi.nlm.nih.gov/articles/PMC6737166/pdf/10278_2019_Article_249.pdf
  links:
    - name: publisher
      url: https://link.springer.com/article/10.1007/s10278-019-00249-5
  abstract: >-
    Breast cancer is the most common cancer diagnosed in women worldwide. Up to 50% of non-palpable breast
    cancers are detected solely through microcalcification clusters in mammograms. This article presents
    a novel and completely automated algorithm for the detection of microcalcification clusters in a mammogram.
    A multiscale 2D non-linear energy operator is proposed for enhancing the contrast between the microcalcifications
    and the background. Several texture, shape, intensity, and histogram of oriented gradients (HOG)–based
    features are used to distinguish microcalcifications from other brighter mammogram regions. A new
    majority class data reduction technique based on data distribution is proposed to counter data imbalance
    problem. The algorithm is able to achieve 100% sensitivity with 2.59, 1.78, and 0.68 average false
    positives per image on Digital Database for Screening Mammography (scanned film), INbreast (direct
    radiography) database, and PGIMER-IITKGP mammogram (direct radiography) database, respectively. Thus,
    it might be used as a second reader as well as a screening tool to reduce the burden on radiologists.
  scholar_id: d1gkVwhDpl0C
- title: Single Image Haze Removal Using Conditional Wasserstein Generative Adversarial Networks
  authors: Joshua Peter Ebenezer, Bijaylaxmi Das, Sudipta Mukhopadhyay
  venue: European Signal Processing Conference (EUSIPCO)
  year: 2019
  section: research
  image: /assets/img/publications/cwgan-dehaze.jpg
  pdf: https://arxiv.org/pdf/1903.00395
  links:
    - name: publisher
      url: https://ieeexplore.ieee.org/abstract/document/8902992/
    - name: arXiv
      url: https://arxiv.org/abs/1903.00395
  abstract: >-
    We present a method to restore a clear image from a haze-affected image using a Wasserstein generative
    adversarial network. As the problem is ill-conditioned, previous methods have required a prior on
    natural images or multiple images of the same scene. We train a generative adversarial network to
    learn the probability distribution of clear images conditioned on the haze-affected images using the
    Wasserstein loss function, using a gradient penalty to enforce the Lipschitz constraint. The method
    is data-adaptive, end-to-end, and requires no further processing or tuning of parameters. We also
    incorporate the use of a texture-based loss metric and the L1 loss to improve results, and show that
    our results are better than the current state-of-the-art.
