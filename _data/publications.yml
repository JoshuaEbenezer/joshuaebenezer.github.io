- title: P2P Live Streaming with Recommender Systems
  authors: Abhinau K Venkataramanan, Joshua Ebenezer, Aniruddh Venkatakrishnan
  venue: Course project report, UT Austin
  year: 2021
  section: other
  image: /assets/img/publications/p2p-streaming.jpg
  pdf: /assets/pdf/P2P_Live_Streaming_with_Recommender_Systems.pdf
  links: []
  abstract: >-
    This system involves people/devices live streaming various channel data (J) from different servers.
    The server bandwidth, in itself, is insufficient to satisfy the streaming-rate for all the users viewing
    the channel. To overcome this issue, each user also redistributes the data it receives into the system
    thereby increasing the effective bandwidth of each channel. Viewing and uploading are strictly decoupled
    in this model, which was introduced in [1]. All allocations are implemented with the aim of maximizing
    Probability of Universal Streaming (PUS) which gives the probability that all users of a channel get
    sufficient bandwidth for uninterrupted viewing.
