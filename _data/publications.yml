- title: A Subjective Study of the Perceptual Acceptability of Audio-Video Desynchronization in Sports
    Videos
  authors: Joshua Peter Ebenezer
  venue: arXiv preprint
  year: 2022
  section: research
  image: /assets/img/publications/av-desync-study.jpg
  pdf: https://arxiv.org/pdf/2212.01686
  links:
    - name: arXiv
      url: https://arxiv.org/abs/2212.01686
  abstract: >-
    This paper presents the results of a study conducted on the perceptual acceptability of audio-video
    desynchronization for sports videos. The study was conducted with 45 videos generated by applying
    8 audio-video offsets on 5 source contents. 20 subjects participated in the study. The results show
    that humans are more sensitive to audio-video offset errors for speech stimuli, and the complex events
    that occur in sports broadcasts have higher thresholds of acceptability. This suggests the tuning
    of audio-video synchronization requirements in broadcasting to the content of the broadcast.
  scholar_id: Se3iqnhoufwC
- title: Subjective Assessment of High Dynamic Range Videos Under Different Ambient Conditions
  authors: Zaixi Shang*, Joshua P Ebenezer*, Alan C Bovik, Yongjun Wu, Hai Wei, Sriram Sethuraman
  equal_contribution: true
  venue: IEEE International Conference on Image Processing (ICIP)
  year: 2022
  section: research
  image: /assets/img/publications/hdr-ambient.jpg
  pdf: https://arxiv.org/pdf/2209.10005
  links:
    - name: publisher
      url: https://ieeexplore.ieee.org/abstract/document/9897940/
    - name: arXiv
      url: https://arxiv.org/abs/2209.10005
  abstract: >-
    High Dynamic Range (HDR) videos can represent a much greater range of brightness and color than Standard
    Dynamic Range (SDR) videos and are rapidly becoming an industry standard. HDR videos have more challenging
    capture, transmission, and display requirements than legacy SDR videos. With their greater bit depth,
    advanced electro-optical transfer functions, and wider color gamuts, comes the need for video quality
    algorithms that are specifically designed to predict the quality of HDR videos. Towards this end,
    we present the first publicly released large-scale subjective study of HDR videos. We study the effect
    of distortions such as compression and aliasing on the quality of HDR videos. We also study the effect
    of ambient illumination on perceptual quality of HDR videos by conducting the study in both a dark
    lab environment and a brighter living-room environment. A total of 66 subjects participated in the
    study and more than 20,000 opinion scores were collected, which makes this the largest in-lab study
    of HDR video quality ever. We anticipate that the dataset will be a valuable resource for researchers
    to develop better models of perceptual quality for HDR videos.
  scholar_id: roLk4NBRz8UC
- title: Subjective and Objective Quality Assessment of High-Motion Sports Videos at Low-Bitrates
  authors: Joshua P Ebenezer, Yixu Chen, Yongjun Wu, Hai Wei, Sriram Sethuraman
  venue: IEEE International Conference on Image Processing (ICIP)
  year: 2022
  section: research
  image: /assets/img/publications/sports-low-bitrate.jpg
  pdf: https://arxiv.org/pdf/2207.05798
  links:
    - name: publisher
      url: https://ieeexplore.ieee.org/abstract/document/9897837/
    - name: arXiv
      url: https://arxiv.org/abs/2207.05798
  abstract: >-
    Videos often have to be transmitted and stored at low bitrates due to poor network connectivity during
    adaptive bitrate streaming. Designing optimal bitrate ladders that would select the perceptually-optimized
    resolution, frame-rate, and compression level for low-bitrate videos for adaptive streaming across
    the internet is therefore a task of great interest. Towards that end, we conducted the first large-scale
    study of medium and low-bitrate videos from live sports for two codecs (Elemental AVC and HEVC) and
    created the Amazon Prime Video Low-Bitrate Sports (APV LBS) dataset. The study involved 94 participants
    and 742 videos, with more than 23,000 human opinion scores collected in total. We analyzed the data
    obtained and we also conducted an extensive evaluation of objective Video Quality Assessment (VQA)
    algorithms and benchmarked their performance, and make recommendations on bitrate ladder design. We're
    making the metadata and VQA features available at https://github.com/JoshuaEbenezer/lbmfr-public.
