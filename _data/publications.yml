- title: A Comparative Study of Single Image Fog Removal Methods
  authors: Bijaylaxmi Das, Joshua Peter Ebenezer, Sudipta Mukhopadhyay
  venue: The Visual Computer
  year: 2022
  section: research
  image: /assets/img/publications/fog-removal-study.jpg
  pdf: /assets/pdf/papers/fog-removal-comparative-study.pdf
  links:
    - name: publisher
      url: https://link.springer.com/article/10.1007/s00371-020-02010-4
  abstract: >-
    The presence of fog degrades visibility in natural scene conditions. Computer vision applications
    like navigation, tracking, and surveillance need clear atmospheric images or videos as prerequisites
    for optimal performance. However, foggy atmosphere creates problems for computer vision applications
    due to reduced visibility. Different fog removal techniques are used to improve the visual quality
    of images and videos. The fog density depends on the depth information. Scene depth information estimation
    needs multiple images, which limits its real-life application. Hence, a single image fog removal requires
    some prior knowledge and/or assumptions to get the depth information. In this paper, the recent fog
    removal techniques are grouped into three broad categories: (1) ﬁlter-based methods, (2) color correction
    based methods, and (3) learning-based methods, for ease of understanding. The primary objective is
    to provide an introduction to this ﬁeld and compare performance (both qualitative and quantitative)
    of representative techniques for each category. It is found that ﬁlter-based methods are doing overall
    better compared to other categories.
  scholar_id: IjCSPb-OGe4C
- title: Study of the Subjective and Objective Quality of High Motion Live Streaming Videos
  authors: Zaixi Shang*, Joshua Peter Ebenezer*, Yongjun Wu, Hai Wei, Sriram Sethuraman, Alan C Bovik
  equal_contribution: true
  venue: IEEE Transactions on Image Processing
  year: 2021
  section: research
  image: /assets/img/publications/live-livestream.jpg
  pdf: /assets/pdf/papers/live-livestream-tip.pdf
  links:
    - name: publisher
      url: https://ieeexplore.ieee.org/abstract/document/9662669/
  abstract: >-
    Video livestreaming is gaining prevalence among video streaming services, especially for the delivery
    of live, high motion content such as sporting events. The quality of these livestreaming videos can
    be adversely affected by any of a wide variety of events, including capture artifacts, and distortions
    incurred during coding and transmission. High motion content can cause or exacerbate many kinds of
    distortion, such as motion blur and stutter. Because of this, the development of objective Video Quality
    Assessment (VQA) algorithms that can predict the perceptual quality of high motion, live streamed
    videos is greatly desired. Important resources for developing these algorithms are appropriate databases
    that exemplify the kinds of live streaming video distortions encountered in practice. Towards making
    progress in this direction, we built a video quality database speciﬁcally designed for live streaming
    VQA research. The new video database is called the Laboratory for Image and Video Engineering (LIVE)
    Livestream Database. The LIVE Livestream Database includes 315 videos of 45 source sequences from
    33 original contents impaired by 6 types of distortions. We also performed a subjective quality study
    using the new database, whereby more than 12,000 human opinions were gathered from 40 subjects. We
    demonstrate the usefulness of the new resource by performing a holistic evaluation of the performance
    of current state-of-the-art (SOTA) VQA models. We envision that researchers will ﬁnd the dataset to
    be useful for the development, testing, and comparison of future VQA models. The LIVE Livestream database
    is being made publicly available for these purposes at https://live.ece. utexas.edu/research/LIVE_APV_Study/apv_index.html
  scholar_id: WF5omc3nYNoC
- title: "ChipQA: No-Reference Video Quality Prediction via Space-Time Chips"
  authors: Joshua Peter Ebenezer*, Zaixi Shang*, Yongjun Wu, Hai Wei, Sriram Sethuraman, Alan C Bovik
  equal_contribution: true
  venue: IEEE Transactions on Image Processing
  year: 2021
  section: research
  image: /assets/img/publications/chipqa.jpg
  pdf: https://arxiv.org/pdf/2109.08726
  links:
    - name: publisher
      url: https://ieeexplore.ieee.org/abstract/document/9540785/
    - name: arXiv
      url: https://arxiv.org/abs/2109.08726
  abstract: >-
    We propose a new model for no-reference video quality assessment (VQA). Our approach uses a new idea
    of highly-localized space-time (ST) slices called Space-Time Chips (ST Chips). ST Chips are localized
    cuts of video data along directions that \textit{implicitly} capture motion. We use perceptually-motivated
    bandpass and normalization models to first process the video data, and then select oriented ST Chips
    based on how closely they fit parametric models of natural video statistics. We show that the parameters
    that describe these statistics can be used to reliably predict the quality of videos, without the
    need for a reference video. The proposed method implicitly models ST video naturalness, and deviations
    from naturalness. We train and test our model on several large VQA databases, and show that our model
    achieves state-of-the-art performance at reduced cost, without requiring motion computation.
  scholar_id: W7OEmFMy1HYC
