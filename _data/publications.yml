- title: Automatic Segmentation of Skin Lesions Using Deep Learning
  authors: Joshua Peter Ebenezer, Jagath C Rajapakse
  venue: arXiv preprint
  year: 2018
  section: research
  image: /assets/img/publications/skin-lesion-seg.jpg
  pdf: https://arxiv.org/pdf/1807.04893
  links:
    - name: arXiv
      url: https://arxiv.org/abs/1807.04893
  abstract: >-
    This paper summarizes the method used in our submission to Task 1 of the International Skin Imaging
    Collaboration's (ISIC) Skin Lesion Analysis Towards Melanoma Detection challenge held in 2018. We
    used a fully automated method to accurately segment lesion boundaries from dermoscopic images. A U-net
    deep learning network is trained on publicly available data from ISIC. We introduce the use of intensity,
    color, and texture enhancement operations as pre-processing steps and morphological operations and
    contour identification as post-processing steps.
  scholar_id: u-x6o8ySG0sC
