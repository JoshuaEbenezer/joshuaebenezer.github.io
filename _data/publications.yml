- title: Image Alignment for Multi-Frame Fusion of Tetra or Other Image Data
  authors: Joshua P Ebenezer, Haegeun Lee, Hamid Rahim Sheikh
  venue: US Patent Application 2025/0225667 A1
  year: 2025
  section: patents
  image: /assets/img/publications/patent-tetra-alignment.jpg
  pdf: null
  links:
    - name: patent
      url: https://patents.google.com/patent/US20250225667A1/en
  abstract: >-
    Non-Bayer color filter array (CFA) input images including reference and non-reference images each
    having a non-Bayer CFA pattern are obtained. Reference and non-reference luma images respectively
    corresponding to a reference Bayer-like pattern based on the reference image and a non-reference Bayer-like
    pattern based on the non-reference image are generated. A resolution of each luma image is approximately
    half a resolution of each input image. A smoothing operation is performed on the luma images to remove
    artifacts and generate filtered reference and non-reference luma images. Motion vectors based on the
    filtered luma images are identified, and the motion vectors and filtered luma images are upscaled
    to generate upscaled motion vectors and upscaled luma images. High-resolution refinement of the upscaled
    motion vectors is performed based on the upscaled luma images to generate a finalized motion vector,
    and the input images are aligned with one another based on the finalized motion vector.
