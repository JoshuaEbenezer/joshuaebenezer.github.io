- title: "DRIFT: Deep Restoration, ISP Fusion, and Tone-mapping"
  authors: >-
    Soumendu Majee*, Joshua Peter Ebenezer*, Abhinau K Venkataramanan, Weidi Liu, Thilo Balke, Zeeshan Nadir,
    Sreenithy Chandran, Seok-Jun Lee, Hamid Rahim Sheikh
  equal_contribution: true
  venue: arXiv preprint
  year: 2026
  section: research
  image: /assets/img/publications/drift.jpg
  pdf: https://arxiv.org/pdf/2604.03402
  links:
    - name: arXiv
      url: https://arxiv.org/abs/2604.03402
  abstract: >-
    Smartphone cameras have gained immense popularity with the adoption of high-resolution and high-dynamic
    range imaging. As a result, high-performance camera Image Signal Processors (ISPs) are crucial in
    generating high-quality images for the end user while keeping computational costs low. In this paper,
    we propose DRIFT (Deep Restoration, ISP Fusion, and Tone-mapping): an efficient AI mobile camera pipeline
    that generates high quality RGB images from hand-held raw captures. The first stage of DRIFT is a
    Multi-Frame Processing (MFP) network that is trained using a adversarial perceptual loss to perform
    multi-frame alignment, denoising, demosaicing, and super-resolution. Then, the output of DRIFT-MFP
    is processed by a novel deep-learning based tone-mapping (DRIFT-TM) solution that allows for tone
    tunability, ensures tone-consistency with a reference pipeline, and can be run efficiently for high-resolution
    images on a mobile device. We show qualitative and quantitative comparisons against state-of-the-art
    MFP and tone-mapping methods to demonstrate the effectiveness of our approach.
  scholar_id: 4TOpqqG69KYC
- title: "GenMFSR: Generative Multi-Frame Image Restoration and Super-Resolution"
  authors: >-
    Harshana Weligampola, Joshua Peter Ebenezer, Weidi Liu, Abhinau K Venkataramanan, Sreenithy Chandran,
    Seok-Jun Lee, Hamid Rahim Sheikh
  venue: arXiv preprint
  year: 2026
  section: research
  image: /assets/img/publications/genmfsr.jpg
  pdf: https://arxiv.org/pdf/2603.19187
  links:
    - name: arXiv
      url: https://arxiv.org/abs/2603.19187
  abstract: >-
    Camera pipelines receive raw Bayer-format frames that need to be denoised, demosaiced, and often super-resolved.
    Multiple frames are captured to utilize natural hand tremors and enhance resolution. Multi-frame super-resolution
    is therefore a fundamental problem in camera pipelines. Existing adversarial methods are constrained
    by the quality of ground truth. We propose GenMFSR, the first Generative Multi-Frame Raw-to-RGB Super
    Resolution pipeline, that incorporates image priors from foundation models to obtain sub-pixel information
    for camera ISP applications. GenMFSR can align multiple raw frames, unlike existing single-frame super-resolution
    methods, and we propose a loss term that restricts generation to high-frequency regions in the raw
    domain, thus preventing low-frequency artifacts.
